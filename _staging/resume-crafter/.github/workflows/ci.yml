name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: 测试 · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 环境自检
        run: python scripts/doctor.py

      - name: 端到端回归测试
        run: python scripts/selftest.py

  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 编译检查所有脚本
        run: python -m compileall -q scripts/

  package:
    name: 打包 Skill
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 校验 Skill 结构
        run: |
          curl -fsSL https://raw.githubusercontent.com/openai/skills/main/skills/.system/skill-creator/scripts/quick_validate.py -o quick_validate.py
          python quick_validate.py .
      - name: 打包
        run: |
          curl -fsSL https://raw.githubusercontent.com/openai/skills/main/skills/.system/skill-creator/scripts/package_skill.py -o package_skill.py
          python package_skill.py .
      - uses: actions/upload-artifact@v4
        with:
          name: resume-crafter-skill
          path: resume-crafter.zip
